name: Maverick
options:
  bundleIdPrefix: com.sennnen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
schemes:
  Maverick:
    build:
      targets:
        Maverick: all
        MaverickTests: [test]
    test:
      targets:
        - MaverickTests
targets:
  Maverick:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Maverick
      - path: build/mav-core/Sources
    info:
      path: Maverick/Info.plist
      properties:
        CFBundleDisplayName: Mav
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sennnen.mav
        PRODUCT_NAME: Mav
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: build/mav-core/MavCore.xcframework
        embed: false
  MaverickTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MaverickTests
    dependencies:
      - target: Maverick
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maverick.app/Maverick"
        BUNDLE_LOADER: "$(TEST_HOST)"
