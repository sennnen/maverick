name: Maverick
options:
  bundleIdPrefix: com.sennnen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
schemes:
  Maverick:
    build:
      targets:
        Maverick: all
        MaverickTests: [test]
    test:
      targets:
        - MaverickTests
targets:
  Maverick:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Maverick
      # Written by tools/platform/build_ios.sh and gitignored, so it is absent on a fresh clone.
      # Optional here purely so the project can be *generated* before the core has been built —
      # without it XcodeGen refuses the spec and a clean checkout cannot produce an .xcodeproj at
      # all. A build with the directory genuinely missing still fails, loudly, at link time.
      - path: build/mav-core/Sources
        optional: true
    info:
      path: Maverick/Info.plist
      properties:
        CFBundleDisplayName: Mav
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Maverick Connector
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.maverick.connector]
        UTImportedTypeDeclarations:
          - UTTypeConformsTo: [public.data]
            UTTypeDescription: Signed Maverick Connector
            UTTypeIdentifier: dev.maverick.connector
            UTTypeTagSpecification:
              public.filename-extension: [mavconn]
              public.mime-type: application/vnd.maverick.connector
        LSSupportsOpeningDocumentsInPlace: true
        NSBluetoothAlwaysUsageDescription: Mav connects to wearables through the signed connector you approve.
        # `processing` is the long window a foundation encoder over a night of PPG needs;
        # `fetch` is the short top-up before a likely app open. Both degrade to the interactive
        # pass on next launch when iOS declines them, which it may always do.
        UIBackgroundModes: [bluetooth-central, processing, fetch]
        # BGTaskScheduler refuses to register an identifier that is not listed here, and a
        # refused registration is a crash at launch rather than a missing feature.
        BGTaskSchedulerPermittedIdentifiers:
          - com.sennnen.mav.analytics.processing
          - com.sennnen.mav.analytics.refresh
        MAVConnectorManagerEnabled: true
        MAVAllowRemoteConnectorImport: true
        MAVOfficialPublisherKeys: []
        MAVConnectorRegistry: {}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sennnen.mav
        PRODUCT_NAME: Mav
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: build/mav-core/MavCore.xcframework
        embed: false
  MaverickTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MaverickTests
      - path: ../../fixtures/platform/host_snapshot_v1.expected.json
        buildPhase: resources
      - path: ../../fixtures/connectors/generic_hr_parity_v1.expected.json
        buildPhase: resources
      - path: ../../fixtures/connectors/whoop4_parity_v1.expected.json
        buildPhase: resources
      - path: ../../fixtures/connectors/whoop5_parity_v1.expected.json
        buildPhase: resources
      # The artifacts themselves, so the parity reports can be checked against the bytes they
      # claim to describe rather than only against a frozen constant.
      - path: ../../fixtures/connectors/generic_hr_v1.mavconn
        buildPhase: resources
      - path: ../../fixtures/connectors/whoop4_v1.mavconn
        buildPhase: resources
      - path: ../../fixtures/connectors/whoop5_v1.mavconn
        buildPhase: resources
      - path: ../../fixtures/ecg/corpus
        buildPhase: resources
    dependencies:
      - target: Maverick
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mav.app/Mav"
        BUNDLE_LOADER: "$(TEST_HOST)"
