name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: generate FFI bindings
        run: |
          cargo build -p mav-ffi
          for lang in swift kotlin; do
            cargo run -q -p mav-ffi --features cli --bin uniffi-bindgen -- \
              generate --library target/debug/libmav_ffi.so --language "$lang" --out-dir target/bindings
          done
          test -f target/bindings/mav_ffi.swift
          test -f target/bindings/uniffi/mav_ffi/mav_ffi.kt
      - name: verify public FFI surface
        run: |
          swift=target/bindings/mav_ffi.swift
          kotlin=target/bindings/uniffi/mav_ffi/mav_ffi.kt
          grep -q 'open class MavRuntime' "$swift"
          grep -q 'public enum TransportAction' "$swift"
          grep -q 'func hostSnapshot' "$swift"
          grep -q 'func notification' "$swift"
          grep -q 'open class MavRuntime' "$kotlin"
          grep -q 'sealed class TransportAction' "$kotlin"
          grep -q 'hostSnapshot' "$kotlin"
          grep -q 'notification' "$kotlin"
          if grep -Eq 'RealtimeProcessor|RawSample|ManifestCodec|PipelineOutput|Store' "$swift" "$kotlin"; then
            echo "internal core type leaked into generated bindings"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check_docs.sh
      - run: python3 tools/check_deps.py

  package-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: brew install xcodegen
      - run: bash tools/platform/build_ios_app.sh
      - run: test -f apps/ios/build/mav-core/MavCore.xcframework/Info.plist
      - run: test -f apps/ios/build/mav-core/Sources/mav_ffi.swift
      - run: test -f apps/ios/build/mav-core/SHA256SUMS

  package-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: sdkmanager "ndk;29.0.14206865"
      - run: bash tools/platform/build_android.sh
      - run: test -f apps/android/build/mav-core/jniLibs/arm64-v8a/libmav_ffi.so
      - run: test -f apps/android/build/mav-core/jniLibs/x86_64/libmav_ffi.so
      - run: test -f apps/android/build/mav-core/Sources/uniffi/mav_ffi/mav_ffi.kt
      - run: test -f apps/android/build/mav-core/SHA256SUMS
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
        working-directory: apps/android
      - run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
      - run: test -f apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
