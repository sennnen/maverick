name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: generate FFI bindings
        run: |
          cargo build -p mav-ffi
          for lang in swift kotlin; do
            cargo run -q -p mav-ffi --features cli --bin uniffi-bindgen -- \
              generate --library target/debug/libmav_ffi.so --language "$lang" --out-dir target/bindings
          done
          test -f target/bindings/mav_ffi.swift
          test -f target/bindings/uniffi/mav_ffi/mav_ffi.kt
      - name: verify public FFI surface
        run: |
          swift=target/bindings/mav_ffi.swift
          kotlin=target/bindings/uniffi/mav_ffi/mav_ffi.kt
          grep -q 'open class MavRuntime' "$swift"
          grep -q 'public enum TransportAction' "$swift"
          grep -q 'func hostSnapshot' "$swift"
          grep -q 'func notification' "$swift"
          grep -q 'open class MavRuntime' "$kotlin"
          grep -q 'sealed class TransportAction' "$kotlin"
          grep -q 'hostSnapshot' "$kotlin"
          grep -q 'notification' "$kotlin"
          grep -q 'struct HistoricalProgress' "$swift"
          grep -q 'func historicalProgress' "$swift"
          grep -q 'lastCursorHash' "$swift"
          grep -q 'affectedDays' "$swift"
          grep -q 'data class HistoricalProgress' "$kotlin"
          grep -q 'historicalProgress' "$kotlin"
          grep -q 'lastCursorHash' "$kotlin"
          grep -q 'affectedDays' "$kotlin"
          if grep -Eq 'RealtimeProcessor|RawSample|ManifestCodec|PipelineOutput|Store' "$swift" "$kotlin"; then
            echo "internal core type leaked into generated bindings"
            exit 1
          fi
          if grep -Eq 'func (acknowledge|forceTrim)' "$swift" || grep -Eq 'fun `?(acknowledge|forceTrim)' "$kotlin"; then
            echo "historical progress must be read-only: no ack or trim on the FFI surface"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tools/check_docs.sh
      - run: python3 tools/check_deps.py

  package-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Remove unrelated Homebrew tap
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi
      - run: brew install xcodegen
      - run: MAV_BUILD_RELEASE=1 bash tools/platform/build_ios_app.sh
        if: github.event_name == 'push'
      - run: bash tools/platform/build_ios_app.sh
        if: github.event_name != 'push'
      - run: test -f apps/ios/build/mav-core/MavCore.xcframework/Info.plist
      - run: test -f apps/ios/build/mav-core/Sources/mav_ffi.swift
      - run: test -f apps/ios/build/mav-core/SHA256SUMS
      - name: Archive iOS release app
        if: github.event_name == 'push'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            apps/ios/build/release/Build/Products/Release-iphoneos/Mav.app \
            apps/ios/build/release/mav-ios-release.zip
      - name: Upload iOS release app
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: mav-ios-release-${{ github.sha }}
          path: apps/ios/build/release/mav-ios-release.zip
          if-no-files-found: error
          retention-days: 14

  package-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Configure Android SDK
        run: |
          : "${ANDROID_HOME:?}"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Locate Android SDK
        id: android-sdk
        run: echo "root=${ANDROID_SDK_ROOT:?}" >> "$GITHUB_OUTPUT"
      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: ${{ steps.android-sdk.outputs.root }}/ndk/29.0.14206865
          key: ${{ runner.os }}-ndk-29.0.14206865
      - run: sdkmanager "ndk;29.0.14206865"
      - name: Prepare Android release signing
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?}"
          : "${ANDROID_KEYSTORE_PASSWORD:?}"
          : "${ANDROID_KEY_ALIAS:?}"
          : "${ANDROID_KEY_PASSWORD:?}"
          keystore="$RUNNER_TEMP/maverick-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
        working-directory: apps/android
      - run: test -f apps/android/build/mav-core/jniLibs/arm64-v8a/libmav_ffi.so
      - run: test -f apps/android/build/mav-core/jniLibs/x86_64/libmav_ffi.so
      - run: test -f apps/android/build/mav-core/Sources/uniffi/mav_ffi/mav_ffi.kt
      - run: test -f apps/android/build/mav-core/SHA256SUMS
      - run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signed Android release APK
        if: github.event_name == 'push'
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          unzip -Z1 "$apk" | grep -Eq '^classes([0-9]+)?\.dex$'
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
      - run: test -f apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
        if: github.event_name != 'push'
      - name: Upload Android release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: mav-android-release-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'push'
    needs: [core, docs, package-ios, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mav-*-release-${{ github.sha }}
          path: release
          merge-multiple: true
      - name: Publish edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="edge-${GITHUB_SHA::7}"
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Maverick edge ${GITHUB_SHA::7}" \
            --prerelease \
            --latest=false \
            --notes "Automated Android-signed and iOS-unsigned native builds from ${GITHUB_SHA}."
