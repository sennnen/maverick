[workspace]
resolver = "2"
members = [
    "crates/mav-model",
    "crates/mav-connector-abi",
    "crates/mav-connector-sdk",
    "crates/mav-connector-runtime",
    "crates/mav-connector-tool",
    "crates/mav-connector-store",
    "crates/mav-timeline",
    "crates/mav-sqi",
    "crates/mav-feature",
    "crates/mav-analytic",
    "crates/mav-store",
    "crates/mav-obs",
    "crates/mav-engine",
    "crates/mav-ffi",
    "crates/mav-replay",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
mav-model = { path = "crates/mav-model" }
mav-connector-abi = { path = "crates/mav-connector-abi" }
mav-connector-sdk = { path = "crates/mav-connector-sdk" }
mav-connector-runtime = { path = "crates/mav-connector-runtime" }
mav-connector-tool = { path = "crates/mav-connector-tool" }
mav-connector-store = { path = "crates/mav-connector-store" }
mav-timeline = { path = "crates/mav-timeline" }
mav-sqi = { path = "crates/mav-sqi" }
mav-feature = { path = "crates/mav-feature" }
mav-analytic = { path = "crates/mav-analytic" }
mav-store = { path = "crates/mav-store" }
mav-obs = { path = "crates/mav-obs" }
mav-engine = { path = "crates/mav-engine" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats with correct nearest-rounding so an f64 written as its shortest
# decimal (e.g. a gravity component in a golden fixture) parses back to the exact same bits. Without
# it serde_json's fast parser can land one ULP off, which would make exact float fixtures unmatchable.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
proptest = "1"
minicbor = { version = "=2.2.2", features = ["derive", "std"] }
wasmparser = { version = "=0.253.0", default-features = false, features = ["std", "validate"] }
sha2 = "=0.11.0"
ed25519-dalek = { version = "=3.0.0", default-features = false }
subtle = "=2.6.1"
wasmi = { version = "=1.1.0", default-features = false, features = ["std", "extra-checks"] }

[profile.release]
opt-level = 3
lto = true
