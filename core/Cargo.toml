[workspace]
resolver = "2"
members = [
    "crates/mav-model",
    "crates/mav-frame",
    "crates/mav-codec",
    "crates/mav-timeline",
    "crates/mav-sqi",
    "crates/mav-feature",
    "crates/mav-analytic",
    "crates/mav-store",
    "crates/mav-obs",
    "crates/mav-engine",
    "crates/mav-ffi",
    "crates/mav-replay",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
mav-model = { path = "crates/mav-model" }
mav-frame = { path = "crates/mav-frame" }
mav-codec = { path = "crates/mav-codec" }
mav-timeline = { path = "crates/mav-timeline" }
mav-sqi = { path = "crates/mav-sqi" }
mav-feature = { path = "crates/mav-feature" }
mav-analytic = { path = "crates/mav-analytic" }
mav-store = { path = "crates/mav-store" }
mav-obs = { path = "crates/mav-obs" }
mav-engine = { path = "crates/mav-engine" }

serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats with correct nearest-rounding so an f64 written as its shortest
# decimal (e.g. a gravity component in a golden fixture) parses back to the exact same bits. Without
# it serde_json's fast parser can land one ULP off, which would make exact float fixtures unmatchable.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
